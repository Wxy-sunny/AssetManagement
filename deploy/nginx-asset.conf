# ============================================================
# 资产管理系统 - nginx 反向代理 + TLS 终止
# 使用：放到 /etc/nginx/sites-available/ 并软链到 sites-enabled，
#       或放到 /etc/nginx/conf.d/asset.conf
# 关键：把下面所有 example.com 替换为你的真实域名，并放好证书路径。
# ============================================================

# HTTP 80：统一 301 跳转到 HTTPS（证书申请期可临时放开 /.well-known 验证）
server {
    listen 80;
    server_name example.com www.example.com;

    # certbot 申请证书时取消下面两行注释
    # location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name example.com www.example.com;

    ssl_certificate     /etc/nginx/ssl/example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/example.com/privkey.pem;
    # 推荐 Mozilla Intermediate 套件；如开启 OCSP stapling 需配置 resolver
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全头（应用层 SecurityHeadersMiddleware 也会下发，这里再补一层）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 前端静态资源（npm run build 产物）
    root /var/www/asset-frontend/dist;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 上传文件大小限制（代理层兜底）
    client_max_body_size 100m;

    # API 反向代理：务必透传 X-Forwarded-*，否则 IP 限流/登录守卫会取错客户端 IP
    location /api/ {
        proxy_pass http://127.0.0.1:5099/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_buffering off;
    }

    # 附件 / 头像静态资源（由 Kestrel wwwroot 提供，经代理转发）
    location /uploads/ {
        proxy_pass http://127.0.0.1:5099/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /avatars/ {
        proxy_pass http://127.0.0.1:5099/avatars/;
        proxy_set_header Host $host;
    }
}
