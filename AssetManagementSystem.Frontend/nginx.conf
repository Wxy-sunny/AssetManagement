server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 用 Docker 内置 DNS 运行时解析 backend，避免容器重建后 nginx 缓存旧 IP 导致 502。
    # 注意：proxy_pass 含变量时尾斜杠会被当作字面 URI，故用 rewrite 剥离 /api/ 前缀，
    # 再使用不带 URI 的 proxy_pass（变量形式）透传剩余路径，确保 /api/auth/captcha -> /auth/captcha。
    location /api/ {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $upstream backend;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$upstream:5099;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 用客户端真实协议（http/https），避免纯 HTTP 部署时后端误判为 https 而下发 HSTS / 触发重定向
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /uploads/ {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $upstream backend;
        proxy_pass http://$upstream:5099;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /avatars/ {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $upstream backend;
        proxy_pass http://$upstream:5099;
        proxy_set_header Host $host;
    }
}
