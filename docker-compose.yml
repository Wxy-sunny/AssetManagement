# ============================================================
# 资产管理系统 - Docker Compose
# 用法：
#   1) 复制 .env.example 为 .env 并填入真实值（.env 已被 .gitignore 忽略）
#   本分支（sqlserver-docker）默认自带 SQL Server 容器；
#   若改用 SQLite，请把 .env 的 DbType 改为 sqlite、填入 AssetConnection=DataSource=/app/data/asset.db，
#   并移除下方 db 服务（或切到 sqlite 分支）。启动：docker compose up -d
#   数据库类型由 .env 的 DbType 决定：sqlserver（默认）/ sqlite（需移除 db 服务）。
#   注意：前端已映射 80 端口（纯 HTTP）。公网 HTTPS 请在宿主机外层再做 TLS 终止。
# ============================================================
name: asset-management

services:
  backend:
    build:
      context: .
      dockerfile: AssetManagementSystem/AssetManagementSystem/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5099
      # 数据库类型：sqlite（省内存）/ sqlserver（需另起 db 容器）
      SqlSugarConfig__DbType: ${DbType}
      # 主机白名单由 appsettings.Production.json 的 AllowedHosts 数组控制（.NET 10 需数组形式）
      # 如需覆盖可用环境变量 AllowedHosts__0 / __1 ...（数组语法），勿用逗号字符串。
      Jwt__SecretKey: ${Jwt__SecretKey}
      ConnectionStrings__AssetConnection: ${AssetConnection}
      AdminSeed__Password: ${AdminSeed__Password}
      Redis__Connection: ${Redis__Connection}
      # 信任 Docker 网桥子网，使 X-Forwarded-For 正确反映真实客户端 IP
      ReverseProxy__TrustedProxies: 172.16.0.0/12
      # 短信服务：默认不启用（接口会返回"短信服务未启用"，不会假成功）。
      # 需要真实短信时在 .env 里填 SmsProvider=aliyun + 密钥/签名/模板，或 SmsProvider=webhook + WebhookUrl。
      Sms__Enabled: ${SmsEnabled:-false}
      Sms__Provider: ${SmsProvider:-none}
      Sms__AccessKeyId: ${SmsAccessKeyId:-}
      Sms__AccessKeySecret: ${SmsAccessKeySecret:-}
      Sms__SignName: ${SmsSignName:-}
      Sms__TemplateCode: ${SmsTemplateCode:-}
      Sms__TextTemplateCode: ${SmsTextTemplateCode:-}
      Sms__RegionId: ${SmsRegionId:-cn-hangzhou}
      Sms__Endpoint: ${SmsEndpoint:-https://dysmsapi.aliyuncs.com/}
      Sms__WebhookUrl: ${SmsWebhookUrl:-}
      Sms__WebhookToken: ${SmsWebhookToken:-}
      Sms__ReturnCodeInResponse: ${SmsReturnCodeInResponse:-false}
      # 全新数据库时由应用自动建表并播种管理员（演示/首次部署用；稳定后改为 "false"）
      DatabaseInitialization__Enabled: "true"
      DatabaseInitialization__CreateTablesOnStartup: "true"
    expose:
      - "5099"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./AssetManagementSystem.Frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  # 自带 SQL Server：应用连接串默认指向本服务（Server=db,1433），随栈启动。
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DbSaPassword}
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/1433' && exit 0 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

volumes:
  redis-data:
  mssql-data:
