# ============================================================
# 资产管理系统 - Docker Compose
# 用法：
#   1) 复制 .env.example 为 .env 并填入真实值（.env 已被 .gitignore 忽略）
#   2) 启动全部服务（后端 + 前端 + Redis，SQLite 内置数据库，无需 SQL Server）：
#        docker compose up -d
#   数据库类型由 .env 的 DbType 决定：sqlite（默认，省内存，适合 2GB 小机）/
#   sqlserver（需另起 db 容器并设 AssetConnection=Server=db,1433;...）。
#   注意：前端已映射 80 端口（纯 HTTP）。公网 HTTPS 请在宿主机外层再做 TLS 终止。
# ============================================================
name: asset-management

services:
  backend:
    build:
      context: .
      dockerfile: AssetManagementSystem/AssetManagementSystem/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5099
      # 数据库类型：sqlite（省内存）/ sqlserver（需另起 db 容器）
      SqlSugarConfig__DbType: ${DbType}
      # 主机白名单由 appsettings.Production.json 的 AllowedHosts 数组控制（.NET 10 需数组形式）
      # 如需覆盖可用环境变量 AllowedHosts__0 / __1 ...（数组语法），勿用逗号字符串。
      Jwt__SecretKey: ${Jwt__SecretKey}
      ConnectionStrings__AssetConnection: ${AssetConnection}
      AdminSeed__Password: ${AdminSeed__Password}
      Redis__Connection: ${Redis__Connection}
      # 信任 Docker 网桥子网，使 X-Forwarded-For 正确反映真实客户端 IP
      ReverseProxy__TrustedProxies: 172.16.0.0/12
      # 全新数据库时由应用自动建表并播种管理员（演示/首次部署用；稳定后改为 "false"）
      DatabaseInitialization__Enabled: "true"
      DatabaseInitialization__CreateTablesOnStartup: "true"
    expose:
      - "5099"
    volumes:
      - asset-data:/app/data
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./AssetManagementSystem.Frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  redis-data:
  asset-data:
